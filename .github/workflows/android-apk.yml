name: Android Standalone APK

on:
  workflow_dispatch:
  push:
    tags:
      - "android-v*"

permissions:
  contents: write

jobs:
  build-apk:
    name: Build standalone Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate the current offline visualizer bundle
        run: pnpm sync:visualizer

      - name: Generate Android native project
        run: pnpm exec expo prebuild --platform android --no-install --clean

      - name: Set up Java for Android Gradle
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Build standalone release APK with bundled JavaScript
        working-directory: android
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Package APK with phone installation instructions
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/Audio-Visualizer-Studio-v1.0.1.apk
          cat > dist/PETUNJUK.txt <<'EOF'
          Audio Visualizer Studio Android v1.0.1

          1. Ekstrak ZIP ini di HP Android menggunakan Files/Pengelola File.
          2. Ketuk Audio-Visualizer-Studio-v1.0.1.apk untuk memasang.
          3. Jika diminta, izinkan pemasangan untuk aplikasi Files/browser yang digunakan.
          4. APK adalah sideload/uji debug-signed, bukan paket Play Store.
          EOF
          (cd dist && zip -0 ../Audio-Visualizer-Studio-Android-v1.0.1.zip Audio-Visualizer-Studio-v1.0.1.apk PETUNJUK.txt)

      - name: Verify APK contains the packaged JavaScript bundle
        run: unzip -l dist/Audio-Visualizer-Studio-v1.0.1.apk | grep -E 'assets/index.android.bundle|assets/.*bundle'

      - name: Upload APK and ZIP as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Audio-Visualizer-Studio-Android-${{ github.run_number }}-v1.0.1
          path: |
            dist/Audio-Visualizer-Studio-v1.0.1.apk
            Audio-Visualizer-Studio-Android-v1.0.1.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish tagged Android standalone release
        if: startsWith(github.ref, 'refs/tags/android-v')
        uses: softprops/action-gh-release@v2
        with:
          name: Audio Visualizer Studio Android 1.0.1
          tag_name: ${{ github.ref_name }}
          prerelease: true
          generate_release_notes: true
          files: |
            dist/Audio-Visualizer-Studio-v1.0.1.apk
            Audio-Visualizer-Studio-Android-v1.0.1.zip
          fail_on_unmatched_files: true
