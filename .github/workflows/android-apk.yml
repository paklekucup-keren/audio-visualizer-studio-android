name: Android Standalone APK

on:
  workflow_dispatch:
  push:
    tags:
      - "android-v*"

permissions:
  contents: write

jobs:
  build-apk:
    name: Build standalone Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate the current offline visualizer bundle
        run: pnpm sync:visualizer

      - name: Generate Android native project
        run: pnpm exec expo prebuild --platform android --no-install --clean

      - name: Set up Java for Android Gradle
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Build standalone release APK with bundled JavaScript
        working-directory: android
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Resolve release version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_NAME}" == android-v* ]]; then
            VERSION="${GITHUB_REF_NAME#android-v}"
          else
            VERSION="$(node -e 'const fs=require("fs");const s=fs.readFileSync("app.config.ts","utf8");const m=s.match(/version: "([^"]+)"/);if(!m)process.exit(1);process.stdout.write(m[1]);')"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+[.][0-9]+[.][0-9]+$ ]]; then echo "Invalid release version: $VERSION"; exit 1; fi
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Package APK with phone installation instructions
        run: |
          mkdir -p dist
          APK_NAME="Audio-Visualizer-Studio-v${APP_VERSION}.apk"
          ZIP_NAME="Audio-Visualizer-Studio-Android-v${APP_VERSION}.zip"
          cp android/app/build/outputs/apk/release/app-release.apk "dist/${APK_NAME}"
          cat > dist/PETUNJUK.txt <<EOF
          Audio Visualizer Studio Android v${APP_VERSION}

          1. Ekstrak ZIP ini di HP Android menggunakan Files/Pengelola File.
          2. Ketuk ${APK_NAME} untuk memasang.
          3. Jika diminta, izinkan pemasangan untuk aplikasi Files/browser yang digunakan.
          4. APK adalah sideload/uji debug-signed, bukan paket Play Store.
          EOF
          (cd dist && zip -0 "../${ZIP_NAME}" "${APK_NAME}" PETUNJUK.txt)

      - name: Verify APK contains the packaged JavaScript bundle
        run: unzip -l "dist/Audio-Visualizer-Studio-v${APP_VERSION}.apk" | grep -E 'assets/index.android.bundle|assets/.*bundle'

      - name: Upload APK and ZIP as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Audio-Visualizer-Studio-Android-${{ github.run_number }}-v${{ env.APP_VERSION }}
          path: |
            dist/Audio-Visualizer-Studio-v${{ env.APP_VERSION }}.apk
            Audio-Visualizer-Studio-Android-v${{ env.APP_VERSION }}.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish tagged Android standalone release
        if: startsWith(github.ref, 'refs/tags/android-v')
        uses: softprops/action-gh-release@v2
        with:
          name: Audio Visualizer Studio Android ${{ env.APP_VERSION }}
          tag_name: ${{ github.ref_name }}
          prerelease: true
          generate_release_notes: true
          files: |
            dist/Audio-Visualizer-Studio-v${{ env.APP_VERSION }}.apk
            Audio-Visualizer-Studio-Android-v${{ env.APP_VERSION }}.zip
          fail_on_unmatched_files: true
